<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modelos 3D Vuelta de Obligado</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 3rem 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        h1 { margin-bottom: 0.5rem; text-align: center; }
        p.subtitle { color: #94a3b8; margin-bottom: 2.5rem; text-align: center; }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            width: 100%;
            max-width: 500px;
        }
        .card-link {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 1.25rem 1.5rem;
            color: #f8fafc;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
        }
        .card-link:hover {
            background: #334155;
            border-color: #3b82f6;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.15);
        }
        .arrow {
            color: #3b82f6;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>Modelos 3D sitio: Vuelta de Obligado</h1>
    <p class="subtitle">Selecciona una opción para acceder a su visor interactivo:</p>
    <div class="links-container">
        <!-- Enlace al Modelo 1 -->
        <a class="card-link" href="https://fedeinglesini.github.io/proyectil/" target="_blank">
            <span>Bala de cañon</span>
            <span class="arrow">&rarr;</span>
        </a>
        <!-- Enlace al Modelo 2 -->
        <a class="card-link" href="https://fedeinglesini.github.io/Fragmento-de-proyectil/"_blank">
            <span>Fragmento de proyectil</span>
            <span class="arrow">&rarr;</span>
        </a>
        <!-- Enlace al Modelo 3 -->
        <a class="card-link" href="https://fedeinglesini.github.io/Boton/" target="_blank">
            <span>Botón de metal</span>
            <span class="arrow">&rarr;</span>
        </a>
    </div>
</body>
</html>
